# MARVCI822: the repo's only workflow was the secret gate -- vitest and tsc
# never ran in CI for ANY PR, so every "N/N green" claim was a local
# measurement the PR head could not prove (found via the review of
# #1037/#1038, measured 2026-08-22).
#
# Deliberately NOT a required status check yet: flipping it to required at
# introduction would block every open PR whose head predates the workflow
# (the required-check-never-ran class). The switch to required is a separate
# owner/Marveen decision, gated on measuring how many open PRs run it green
# (decision msg 14205, recorded on the MARVCI822 card).
name: test

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Full install ON PURPOSE, unlike the secret-gate's --ignore-scripts:
      # the suite exercises native bindings, and an install that skips their
      # build would fail the ABI probe instead of measuring the code.
      - run: npm ci
      # The suite resolves the `claude` binary at module load (resolveFromPath
      # throws when it is absent) -- without this stub 17 suites fail at
      # COLLECTION, before a single test runs (measured on the first ubuntu
      # run). The stub satisfies PATH resolution only; it exits 1 LOUDLY, so if
      # any test ever actually executes claude, that run fails visibly instead
      # of silently faking success.
      - name: Stub the claude binary for PATH resolution
        run: |
          sudo install -m 755 /dev/stdin /usr/local/bin/claude <<'EOF'
          #!/bin/sh
          echo "claude CI stub: tests must not execute this binary" >&2
          exit 1
          EOF
      - run: npm run typecheck
      - run: npm test
      # Shell-test wiring (SEEDREFRESH826 fold-in, from the #1066 verify): a
      # regression guard that only runs manually rots exactly like a one-shot
      # seed. Runs natively here (ubuntu = the Linux branch it asserts).
      - run: bash scripts/__tests__/stop-start-system-unit.test.sh
      # B45: the agent-tree ACL target and the write check. Pure logic, no fleet
      # user needed; a guard that only runs by hand rots like the one above.
      - run: python3 -B scripts/__tests__/b45-acl.test.py
      # B45 B2-4: the daily run of that check and the bootstrap line reading its result.
      - run: python3 -B scripts/__tests__/b45-jogellenorzo-napi.test.py
      # P0-1 L4: the daily access preflight wrapper
      - run: python3 -B scripts/__tests__/access-preflight-napi.test.py
      # P1-00f point 1: gcal.sh prints a mail sender's text only inside an untrusted envelope
      - run: python3 -B scripts/__tests__/gcal-untrusted.test.py
      # the fleet token's expiry: ci-el-or.sh alarms 14 days before it (acrobot 31196)
      - run: python3 -B scripts/__tests__/ci-el-or.test.py
      # F0-2: who can read which secret, computed from owner, group and mode (fleet-secrets.py --matrix)
      - run: python3 -B scripts/__tests__/fleet-secrets-matrix.test.py
      # D4 step 2: the GitHub App token broker, the guarded approver, the credential helper, the merge switch
      - run: python3 -B scripts/__tests__/fleet-github.test.py
      # B48 pótlás: a Bash permission prompt answered by the owner's Discord decision, never a key
      - run: python3 -B scripts/hooks/tests/permission-approval.test.py
      # D4 after a container recreate: fleet-bootstrap.sh 4a restores the broker's root scripts and sudo rule
      - run: python3 -B scripts/__tests__/fleet-bootstrap-d4.test.py
      # B48 (2) after a container recreate: step 4c restores the fleet-pane broker, step 4 keeps a retired tmux line out
      - run: python3 -B scripts/__tests__/fleet-bootstrap-fleet-pane.test.py
      # the token-budget guard: its Escape takes the broker's interrupt verb when the switch is on
      - run: bash scripts/__tests__/feladat-keret-or.test.sh
      # the shell tools read FLEET_PANE_BROKER exactly as src/config.ts does
      - run: python3 -B scripts/__tests__/fleet-pane-switch.test.py
      # P0-1: a skill or a manual call presents the caller's own dashboard token, not the shared one
      - run: python3 -B scripts/__tests__/dashboard-fejlec.test.py
      - run: python3 -B scripts/__tests__/skill-kozos-token-csere.test.py
      # docs/FIGMA-MAP.md: every node link, view and render function the map names exists
      - run: node scripts/figma-map-check.mjs
      # the owner token's retirement, PR 1: the github_token helpers and the guard on direct readers
      - run: python3 -B scripts/__tests__/github-token.test.py
      # M-3: the daily permission-change watcher on that matrix (titok-jog-figyelo.py)
      - run: python3 -B scripts/__tests__/titok-jog-figyelo.test.py
      # D5: the fleet publishes no production OTA update, mobil-ota.sh only prints Balázs's line
      - run: python3 -B scripts/__tests__/mobil-ota.test.py
      # B48 (2): the root broker into agent panes takes no key on a dialog, refuses bad arguments
      - run: python3 -B scripts/__tests__/fleet-pane.test.py
      # reviewer-profil: the git reader (a trapped repo runs nothing through it; script(1)
      # gives git a terminal for the pager trap), the packet reader and the verdict writer.
      - run: bash scripts/__tests__/git-olvas.test.sh
      - run: bash scripts/__tests__/review-scripts.test.sh
      - run: bash scripts/__tests__/review-csomag.test.sh
      # B8: the restore probe of the OS, Commerce and document-store backups (the host script
      # with a docker stub and a local NAS), and the fleet's reader of its result.
      - run: bash scripts/__tests__/acropora-restore-probe.test.sh
      # ...and its counting SQL against a REAL postgres: the runner image ships one, stopped.
      # The test fails (does not skip) without psql, so a runner change shows up red.
      - name: Start postgres for the restore probe's SQL test
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser -s "$USER"
          createdb probe_sql
      - run: bash scripts/__tests__/acropora-restore-probe-sql.test.sh

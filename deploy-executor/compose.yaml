# The separate deploy executor (SB1). Its own compose project on the host:
#   /opt/vegrehajto/compose.yaml      (this file, root-owned)
#   /opt/vegrehajto/src               (root-owned clone at a reviewed commit)
#   /opt/vegrehajto/config.json       (root-owned, the allowlist and settings)
#   /opt/vegrehajto/titkok/           (root 700; the four token files, the gate key and its known_hosts, 10001 400)
# NOT under /opt/marveen-docker: that tree is mounted writable into the fleet.
# No docker socket, no host port, no host path of the fleet.
#
# B20b (task b20b-coolify2-tailnet, plan exchange/biztonsag/baseline/b20b-coolify2-*): the AI
# machine's Coolify (coolify2) is reachable on the tailnet only, so the executor gets its OWN
# Tailscale identity through the `ts` sidecar (tag:vegrehajto; the tailnet policy gives it
# tag:stage-ai:8000 and nothing else). The executor joins the sidecar's network namespace: its
# hardening (read-only, no capabilities, no new privileges, uid 10001) does not change, and only the
# sidecar holds NET_ADMIN and the tun device. Kernel mode, because in userspace mode (containerboot's
# default) the executor would reach the tailnet only through a proxy its fetch does not use.
name: vegrehajto

services:
  ts:
    # set in /opt/vegrehajto/.env as tailscale/tailscale:<version>@sha256:<digest>; no value, no start
    image: ${VEGREHAJTO_TS_IMAGE:?set VEGREHAJTO_TS_IMAGE in /opt/vegrehajto/.env to tailscale/tailscale:<version>@sha256:<digest>}
    container_name: vegrehajto-ts
    hostname: vegrehajto
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    environment:
      # the variable names and the file: prefix: tailscale/tailscale cmd/containerboot/main.go
      TS_AUTHKEY: file:/run/secrets/ts-authkey
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      # Docker's DNS stays: the fleet's name for the executor (`vegrehajto`) keeps resolving
      TS_ACCEPT_DNS: "false"
      TS_HOSTNAME: vegrehajto
      # no subnet routes and no exit node, said aloud (barracuda, plan review): the tailnet has a
      # subnet router and an exit node, and a later default must not send the executor's traffic there;
      # no exit node is set (none is the default); the install reads both back from the prefs
      TS_EXTRA_ARGS: --advertise-tags=tag:vegrehajto --accept-routes=false
    volumes:
      - type: volume
        source: ts-allapot
        target: /var/lib/tailscale
    secrets:
      - ts-authkey
    networks:
      hivas:
        # the fleet calls http://vegrehajto:8787; the executor listens in this namespace
        aliases:
          - vegrehajto
      ki: {}

  vegrehajto:
    build:
      context: /opt/vegrehajto/src
      dockerfile: deploy-executor/Dockerfile
      args:
        # set in /opt/vegrehajto/.env as <image>@sha256:<digest>; no value, no build
        NODE_IMAGE: ${VEGREHAJTO_NODE_IMAGE:?set VEGREHAJTO_NODE_IMAGE in /opt/vegrehajto/.env to node:22-bookworm-slim@sha256:<digest>}
    image: vegrehajto:local
    container_name: vegrehajto
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    environment:
      VEGREHAJTO_CONFIG: /etc/vegrehajto/config.json
      VEGREHAJTO_PORT: "8787"
    volumes:
      - type: bind
        source: /opt/vegrehajto/config.json
        target: /etc/vegrehajto/config.json
        read_only: true
      - type: volume
        source: allapot
        target: /var/lib/vegrehajto
    secrets:
      - coolify-prod-deploy
      - coolify-ai-deploy
      - discord-olvaso
      - github-olvaso
      # the SSH door to the B8 gate (fleet_ro grants, task parancssor-a-fleet-ro-grant): the executor's own key, and the
      # host's key pinned in a known_hosts file (README, "The fleet_ro grant button")
      - gate-key
      - gate-known-hosts
    # the sidecar's namespace: its two networks and its tailnet address (B20b)
    network_mode: service:ts
    depends_on:
      - ts

networks:
  # the fleet's container joins this one (docker network connect); nothing else
  hivas:
    name: vegrehajto-hivas
    internal: true
  # outward only: Discord, GitHub, the two Coolify APIs
  ki:
    name: vegrehajto-ki

volumes:
  allapot:
    name: vegrehajto-allapot
  ts-allapot:
    name: vegrehajto-ts-allapot

secrets:
  coolify-prod-deploy:
    file: /opt/vegrehajto/titkok/coolify-prod-deploy
  coolify-ai-deploy:
    file: /opt/vegrehajto/titkok/coolify-ai-deploy
  discord-olvaso:
    file: /opt/vegrehajto/titkok/discord-olvaso
  github-olvaso:
    file: /opt/vegrehajto/titkok/github-olvaso
  gate-key:
    file: /opt/vegrehajto/titkok/gate-key
  gate-known-hosts:
    file: /opt/vegrehajto/titkok/gate-known-hosts
  # a one-time, pre-approved Tailscale auth key tagged tag:vegrehajto (root 600; read by the
  # sidecar, which runs as root, at its first login only: TS_AUTH_ONCE)
  ts-authkey:
    file: /opt/vegrehajto/titkok/ts-authkey

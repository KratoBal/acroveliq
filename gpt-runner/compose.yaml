# The GPT runner (task t-20261014-gpt-futtato-kontener). Its own compose project on the host:
#   /opt/gpt-futtato/compose.yaml   (this file, root-owned)
#   /opt/gpt-futtato/.env           (root-owned: the pinned base image, the fleet's addresses)
#   /opt/gpt-futtato/src            (root-owned clone at a reviewed commit)
# NOT under /opt/marveen-docker: that tree is mounted writable into the fleet.
#
# Balázs's conditions (2026-10-14): no fleet file, volume, credential or internal service
# (1, 5); not root, least privilege, resource limits (2); the GPT side stays off (6). So: no bind
# mount, no secret, no docker socket, no host port, and ONE network, outward only. The channel to
# the controller is a later PR, on a network of its own (plan v2: not the fleet's).
name: gpt-futtato

services:
  gpt-futtato:
    build:
      context: /opt/gpt-futtato/src
      dockerfile: gpt-runner/Dockerfile
      args:
        NODE_IMAGE: ${GPT_FUTTATO_NODE_IMAGE:?set GPT_FUTTATO_NODE_IMAGE in /opt/gpt-futtato/.env to node:22-bookworm-slim@sha256:<digest>}
    image: gpt-futtato:local
    container_name: gpt-futtato
    # one probe run, then it stops; nothing restarts it (the GPT side is off)
    restart: "no"
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    environment:
      # the fleet container's addresses, for the negative network test (N1); see README
      PROBA_FLOTTA_CIMEK: ${GPT_FUTTATO_FLOTTA_CIMEK:-}
    volumes:
      - type: volume
        source: codex-home
        target: /home/gpt
    networks:
      - ki

networks:
  # outward only; no fleet container joins it
  ki:
    name: gpt-futtato-ki

volumes:
  # empty: the Codex login (~/.codex) lands here only after Balázs's separate approval
  codex-home:
    name: gpt-futtato-codex-home
